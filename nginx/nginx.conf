server {
  listen 8080;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Baseline security headers (apply to the app HTML)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 256;

  # Fingerprinted build assets can be cached forever
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Served from a writable path so the root filesystem can stay read-only;
  # entrypoint.sh refreshes it on every container start.
  location = /ipinfo.json {
    alias /tmp/ipinfo.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
  }

  # SPA fallback
  location / {
    try_files $uri /index.html;
  }
}
