apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whereami-ingress
  labels:
    app: whereami
spec:
  # Uses the cluster's default IngressClass for portability. If your cluster has no
  # default, set `ingressClassName:` to match your controller (nginx, traefik, alb, …).
  rules:
  - host: whereami.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: whereami-service
            port:
              number: 80